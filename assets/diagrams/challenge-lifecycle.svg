<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Challenge lifecycle</title>
  <desc id="desc">A human or agent can raise a Challenge against a Decision, implementation, evidence, behaviour, opportunity or unknown. Investigation may result in no change, an implementation correction, a human Decision change, evidence correction, accepted risk, or a split.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0 0 L0 6 L9 3 z" fill="#64748b"/>
    </marker>
    <style>
      .t { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .muted { fill: #475569; }
      .box { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
      .line { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="660" rx="20" fill="#f8fafc"/>
  <text class="t" x="600" y="48" text-anchor="middle" font-size="27" font-weight="700">Challenges preserve unresolved engineering questions</text>
  <text class="t muted" x="600" y="78" text-anchor="middle" font-size="15">Agents may raise Challenges. Only humans can authorise a change to the model.</text>

  <rect x="60" y="235" width="190" height="125" rx="16" fill="#fff7ed" stroke="#f59e0b" stroke-width="2.5"/>
  <text class="t" x="155" y="274" text-anchor="middle" font-size="19" font-weight="700">Challenge</text>
  <text class="t muted" x="155" y="303" text-anchor="middle" font-size="13">human or agent authored</text>
  <text class="t muted" x="155" y="326" text-anchor="middle" font-size="13">questions current state</text>

  <path class="line" d="M250 298 H330"/>

  <rect x="340" y="235" width="190" height="125" rx="16" class="box"/>
  <text class="t" x="435" y="274" text-anchor="middle" font-size="19" font-weight="700">Investigate</text>
  <text class="t muted" x="435" y="303" text-anchor="middle" font-size="13">research · reproduce</text>
  <text class="t muted" x="435" y="326" text-anchor="middle" font-size="13">gather evidence</text>

  <path class="line" d="M530 298 H605"/>

  <rect x="615" y="130" width="220" height="76" rx="14" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
  <text class="t" x="725" y="161" text-anchor="middle" font-size="16" font-weight="700">No change</text>
  <text class="t muted" x="725" y="185" text-anchor="middle" font-size="12">current model stands</text>

  <rect x="615" y="225" width="220" height="76" rx="14" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
  <text class="t" x="725" y="256" text-anchor="middle" font-size="16" font-weight="700">Implementation correction</text>
  <text class="t muted" x="725" y="280" text-anchor="middle" font-size="12">restore existing Decision conformance</text>

  <rect x="615" y="320" width="220" height="76" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text class="t" x="725" y="351" text-anchor="middle" font-size="16" font-weight="700">Decision change</text>
  <text class="t muted" x="725" y="375" text-anchor="middle" font-size="12">human authority required</text>

  <rect x="615" y="415" width="220" height="76" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text class="t" x="725" y="446" text-anchor="middle" font-size="16" font-weight="700">Evidence correction</text>
  <text class="t muted" x="725" y="470" text-anchor="middle" font-size="12">requalify or relabel claim</text>

  <rect x="615" y="510" width="220" height="76" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text class="t" x="725" y="541" text-anchor="middle" font-size="16" font-weight="700">Accepted risk / split</text>
  <text class="t muted" x="725" y="565" text-anchor="middle" font-size="12">human judgement where semantic</text>

  <path class="line" d="M605 298 C580 298 580 168 605 168"/>
  <path class="line" d="M605 298 C590 298 590 263 605 263"/>
  <path class="line" d="M605 298 C590 298 590 358 605 358"/>
  <path class="line" d="M605 298 C580 298 580 453 605 453"/>
  <path class="line" d="M605 298 C570 298 570 548 605 548"/>

  <rect x="930" y="290" width="210" height="135" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text class="t" x="1035" y="329" text-anchor="middle" font-size="18" font-weight="700">Resolved Challenge</text>
  <text class="t muted" x="1035" y="357" text-anchor="middle" font-size="13">resolution + evidence</text>
  <text class="t muted" x="1035" y="380" text-anchor="middle" font-size="13">links to resulting Decision</text>
  <text class="t muted" x="1035" y="403" text-anchor="middle" font-size="13">or implementation</text>

  <path class="line" d="M835 168 C900 168 900 300 920 320"/>
  <path class="line" d="M835 263 C890 263 895 330 920 340"/>
  <path class="line" d="M835 358 H920"/>
  <path class="line" d="M835 453 C890 453 895 390 920 380"/>
  <path class="line" d="M835 548 C900 548 900 420 920 400"/>

  <text class="t muted" x="600" y="628" text-anchor="middle" font-size="13">A Challenge may reveal a missing Decision; it must never silently become one.</text>
</svg>