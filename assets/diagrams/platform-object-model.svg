<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Decision-native platform object model</title>
<desc id="desc">Intent and human decisions form the authority layer. Challenges question the current model. Decision Reviews connect decisions to agent workspaces, implementation and evidence before human acceptance.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker><style>.t{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#0f172a}.m{fill:#475569}.b{fill:#fff;stroke:#cbd5e1;stroke-width:2}.l{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#a)}</style></defs>
<rect width="1280" height="720" rx="20" fill="#f8fafc"/>
<text class="t" x="640" y="48" text-anchor="middle" font-size="27" font-weight="700">Decision-native platform object model</text>
<text class="t m" x="640" y="78" text-anchor="middle" font-size="15">Authority remains human; agents can challenge, implement, review and qualify.</text>
<rect x="80" y="125" width="200" height="95" rx="15" fill="#eef2ff" stroke="#6366f1" stroke-width="2.5"/>
<text class="t" x="180" y="162" text-anchor="middle" font-size="19" font-weight="700">Intent</text><text class="t m" x="180" y="190" text-anchor="middle" font-size="13">mutable human objective</text>
<rect x="80" y="300" width="200" height="110" rx="15" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
<text class="t" x="180" y="338" text-anchor="middle" font-size="19" font-weight="700">Decisions</text><text class="t m" x="180" y="365" text-anchor="middle" font-size="13">human-authoritative</text><text class="t m" x="180" y="388" text-anchor="middle" font-size="13">accepted history immutable</text>
<rect x="80" y="500" width="200" height="105" rx="15" fill="#fff7ed" stroke="#f59e0b" stroke-width="2.5"/>
<text class="t" x="180" y="538" text-anchor="middle" font-size="19" font-weight="700">Challenges</text><text class="t m" x="180" y="565" text-anchor="middle" font-size="13">human or agent raised</text><text class="t m" x="180" y="587" text-anchor="middle" font-size="13">questions, not authority</text>
<rect x="420" y="245" width="250" height="190" rx="18" fill="#fff" stroke="#7c3aed" stroke-width="2.5"/>
<text class="t" x="545" y="285" text-anchor="middle" font-size="20" font-weight="700">Decision Review</text><text class="t m" x="545" y="318" text-anchor="middle" font-size="13">intent + Decision basis</text><text class="t m" x="545" y="342" text-anchor="middle" font-size="13">Challenges + candidates</text><text class="t m" x="545" y="366" text-anchor="middle" font-size="13">conformance + evidence</text><text class="t m" x="545" y="390" text-anchor="middle" font-size="13">residual risk</text>
<rect x="790" y="105" width="210" height="105" rx="15" class="b"/><text class="t" x="895" y="143" text-anchor="middle" font-size="18" font-weight="700">Agent Workspaces</text><text class="t m" x="895" y="170" text-anchor="middle" font-size="13">research · implement</text><text class="t m" x="895" y="192" text-anchor="middle" font-size="13">review · qualify</text>
<rect x="790" y="290" width="210" height="105" rx="15" class="b"/><text class="t" x="895" y="328" text-anchor="middle" font-size="18" font-weight="700">Implementation</text><text class="t m" x="895" y="355" text-anchor="middle" font-size="13">code · tests · infra</text><text class="t m" x="895" y="377" text-anchor="middle" font-size="13">candidate artefacts</text>
<rect x="790" y="475" width="210" height="105" rx="15" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/><text class="t" x="895" y="513" text-anchor="middle" font-size="18" font-weight="700">Evidence</text><text class="t m" x="895" y="540" text-anchor="middle" font-size="13">claim · revision · result</text><text class="t m" x="895" y="562" text-anchor="middle" font-size="13">boundary · freshness</text>
<rect x="1080" y="275" width="140" height="135" rx="15" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/><text class="t" x="1150" y="314" text-anchor="middle" font-size="18" font-weight="700">Human</text><text class="t" x="1150" y="337" text-anchor="middle" font-size="18" font-weight="700">acceptance</text><text class="t m" x="1150" y="370" text-anchor="middle" font-size="12">merge accepts</text><text class="t m" x="1150" y="390" text-anchor="middle" font-size="12">Decisions + result</text>
