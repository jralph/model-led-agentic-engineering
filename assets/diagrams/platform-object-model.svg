<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Decision-native platform object model</title>
<desc id="desc">The platform uses Task as its work-item container for Model-led Intent or Challenge. Tasks feed Decision Reviews, which connect human Decisions to agent workspaces, implementation and evidence before human acceptance.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker><style>.t{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#0f172a}.m{fill:#475569}.b{fill:#fff;stroke:#cbd5e1;stroke-width:2}.l{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#a)}</style></defs>
<rect width="1280" height="720" rx="20" fill="#f8fafc"/>
<text class="t" x="640" y="48" text-anchor="middle" font-size="27" font-weight="700">Decision-native platform object model</text>
<text class="t m" x="640" y="78" text-anchor="middle" font-size="15">Task is a platform container. Intent and Challenge retain their Model-led semantics.</text>

<rect x="70" y="120" width="260" height="165" rx="18" fill="#fff" stroke="#94a3b8" stroke-width="2.5"/>
<text class="t" x="200" y="157" text-anchor="middle" font-size="20" font-weight="700">Task</text>
<rect x="93" y="180" width="98" height="65" rx="11" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text class="t" x="142" y="207" text-anchor="middle" font-size="15" font-weight="700">Intent</text>
<text class="t m" x="142" y="228" text-anchor="middle" font-size="11">human-owned</text>
<rect x="209" y="180" width="98" height="65" rx="11" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
<text class="t" x="258" y="207" text-anchor="middle" font-size="15" font-weight="700">Challenge</text>
<text class="t m" x="258" y="228" text-anchor="middle" font-size="11">human / agent</text>
<text class="t m" x="200" y="269" text-anchor="middle" font-size="12">potential work · may close after research</text>

<rect x="70" y="380" width="260" height="115" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
<text class="t" x="200" y="418" text-anchor="middle" font-size="19" font-weight="700">Decisions</text>
<text class="t m" x="200" y="446" text-anchor="middle" font-size="13">human-authoritative</text>
<text class="t m" x="200" y="469" text-anchor="middle" font-size="13">accepted history immutable</text>

<rect x="430" y="225" width="260" height="210" rx="18" fill="#fff" stroke="#7c3aed" stroke-width="2.5"/>
<text class="t" x="560" y="265" text-anchor="middle" font-size="20" font-weight="700">Decision Review</text>
<text class="t m" x="560" y="300" text-anchor="middle" font-size="13">Task context</text>
<text class="t m" x="560" y="324" text-anchor="middle" font-size="13">Decision basis</text>
<text class="t m" x="560" y="348" text-anchor="middle" font-size="13">candidate implementation</text>
<text class="t m" x="560" y="372" text-anchor="middle" font-size="13">conformance + evidence</text>
<text class="t m" x="560" y="396" text-anchor="middle" font-size="13">residual risk</text>

<path class="l" d="M330 203 C385 203 390 265 420 285"/>
<path class="l" d="M330 438 H420"/>

<rect x="800" y="105" width="210" height="105" rx="15" class="b"/>
<text class="t" x="905" y="143" text-anchor="middle" font-size="18" font-weight="700">Agent Workspaces</text>
<text class="t m" x="905" y="170" text-anchor="middle" font-size="13">research · implement</text>
<text class="t m" x="905" y="192" text-anchor="middle" font-size="13">review · qualify</text>

<rect x="800" y="290" width="210" height="105" rx="15" class="b"/>
<text class="t" x="905" y="328" text-anchor="middle" font-size="18" font-weight="700">Implementation</text>
<text class="t m" x="905" y="355" text-anchor="middle" font-size="13">code · tests · infra</text>
<text class="t m" x="905" y="377" text-anchor="middle" font-size="13">candidate artefacts</text>

<rect x="800" y="475" width="210" height="105" rx="15" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
<text class="t" x="905" y="513" text-anchor="middle" font-size="18" font-weight="700">Evidence</text>
<text class="t m" x="905" y="540" text-anchor="middle" font-size="13">claim · revision · result</text>
<text class="t m" x="905" y="562" text-anchor="middle" font-size="13">boundary · freshness</text>

<rect x="1090" y="275" width="140" height="135" rx="15" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
<text class="t" x="1160" y="314" text-anchor="middle" font-size="18" font-weight="700">Human</text>
<text class="t" x="1160" y="337" text-anchor="middle" font-size="18" font-weight="700">acceptance</text>
<text class="t m" x="1160" y="370" text-anchor="middle" font-size="12">accepts exact</text>
<text class="t m" x="1160" y="390" text-anchor="middle" font-size="12">Decisions + result</text>

<path class="l" d="M690 278 C735 235 760 190 790 160"/>
<path class="l" d="M690 330 H790"/>
<path class="l" d="M690 382 C735 430 760 500 790 525"/>
<path class="l" d="M1010 342 H1080"/>
<path class="l" d="M1010 527 C1060 510 1070 420 1110 405"/>

<rect x="355" y="535" width="370" height="85" rx="14" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<text class="t" x="540" y="568" text-anchor="middle" font-size="16" font-weight="700">No Decision Review is required if the Task stops early</text>
<text class="t m" x="540" y="595" text-anchor="middle" font-size="12">Exploration and research are valid outcomes even when nothing ships.</text>

<text class="t m" x="640" y="670" text-anchor="middle" font-size="13">The platform implements Model-led. Model-led remains portable without the platform or its Task object.</text>
</svg>