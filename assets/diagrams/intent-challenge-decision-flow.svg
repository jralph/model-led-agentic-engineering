<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="660" viewBox="0 0 1240 660" role="img" aria-labelledby="title desc">
<title id="title">Intent, Challenge and Decision flow</title>
<desc id="desc">Human Intent and human or agent Challenges enter exploration and research. Work may stop with no change, proceed under existing Decisions, or require a new human Decision before semantic implementation.</desc>
<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker>
<style>.t{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#0f172a}.m{fill:#475569}.b{fill:#fff;stroke:#cbd5e1;stroke-width:2}.l{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#a)}</style>
</defs>
<rect width="1240" height="660" rx="20" fill="#f8fafc"/>
<text class="t" x="620" y="48" text-anchor="middle" font-size="27" font-weight="700">Intent and Challenge are pre-decisional</text>
<text class="t m" x="620" y="78" text-anchor="middle" font-size="15">They may create work, but neither creates semantic authority by itself.</text>

<rect x="70" y="120" width="220" height="105" rx="16" fill="#eef2ff" stroke="#6366f1" stroke-width="2.5"/>
<text class="t" x="180" y="159" text-anchor="middle" font-size="19" font-weight="700">Intent</text>
<text class="t m" x="180" y="188" text-anchor="middle" font-size="13">human-owned outcome</text>

<rect x="70" y="300" width="220" height="105" rx="16" fill="#fff7ed" stroke="#f59e0b" stroke-width="2.5"/>
<text class="t" x="180" y="339" text-anchor="middle" font-size="19" font-weight="700">Challenge</text>
<text class="t m" x="180" y="368" text-anchor="middle" font-size="13">question / missing authority</text>

<path class="l" d="M290 172 C350 172 350 250 410 250"/>
<path class="l" d="M290 352 C350 352 350 275 410 275"/>

<rect x="420" y="195" width="235" height="145" rx="18" class="b"/>
<text class="t" x="537.5" y="233" text-anchor="middle" font-size="19" font-weight="700">Explore / Research</text>
<text class="t m" x="537.5" y="262" text-anchor="middle" font-size="13">reconstruct the model</text>
<text class="t m" x="537.5" y="285" text-anchor="middle" font-size="13">test assumptions</text>
<text class="t m" x="537.5" y="308" text-anchor="middle" font-size="13">gather evidence</text>

<path class="l" d="M655 268 H720"/>

<rect x="730" y="100" width="225" height="85" rx="14" class="b"/>
<text class="t" x="842.5" y="134" text-anchor="middle" font-size="16" font-weight="700">Stop / defer</text>
<text class="t m" x="842.5" y="160" text-anchor="middle" font-size="12">no system change needed</text>

<rect x="730" y="225" width="225" height="95" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
<text class="t" x="842.5" y="259" text-anchor="middle" font-size="16" font-weight="700">Decision basis sufficient</text>
<text class="t m" x="842.5" y="285" text-anchor="middle" font-size="12">existing Decisions govern work</text>

<rect x="730" y="360" width="225" height="105" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2.5"/>
<text class="t" x="842.5" y="394" text-anchor="middle" font-size="16" font-weight="700">New semantic choice</text>
<text class="t m" x="842.5" y="420" text-anchor="middle" font-size="12">human Decision required</text>
<text class="t m" x="842.5" y="443" text-anchor="middle" font-size="12">before behaviour is established</text>

<path class="l" d="M690 268 C690 145 705 142 720 142"/>
<path class="l" d="M690 268 H720"/>
<path class="l" d="M690 268 C690 410 705 412 720 412"/>

<path class="l" d="M955 272 H1010"/>
<path class="l" d="M955 412 C995 412 995 310 1010 310"/>

<rect x="1020" y="220" width="170" height="155" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
<text class="t" x="1105" y="257" text-anchor="middle" font-size="18" font-weight="700">Implementation</text>
<text class="t m" x="1105" y="285" text-anchor="middle" font-size="13">if work remains</text>
<text class="t m" x="1105" y="311" text-anchor="middle" font-size="13">review conformance</text>
<text class="t m" x="1105" y="334" text-anchor="middle" font-size="13">qualify claims</text>
<text class="t m" x="1105" y="357" text-anchor="middle" font-size="13">reconcile model</text>

<rect x="350" y="520" width="540" height="90" rx="15" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<text class="t" x="620" y="554" text-anchor="middle" font-size="17" font-weight="700">No meaningful semantic implementation may outrun its Decision basis</text>
<text class="t m" x="620" y="582" text-anchor="middle" font-size="13">Existing Decisions may be enough. New Decisions are required only when new semantic authority is needed.</text>
</svg>