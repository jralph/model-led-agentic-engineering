<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Decision-first review contract</title>
  <desc id="desc">A review combines proposed semantic Decisions, implementation and qualification evidence. Agents may propose Decisions; human acceptance makes semantic Decisions authoritative. Pull-request merge is one possible workflow mechanism.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .t { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .muted { fill: #475569; }
      .box { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
      .line { fill: none; stroke: #475569; stroke-width: 2.2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="620" rx="20" fill="#f8fafc"/>
  <text class="t" x="600" y="48" text-anchor="middle" font-size="27" font-weight="700">A review can become an engineering acceptance boundary</text>
  <text class="t muted" x="600" y="78" text-anchor="middle" font-size="16">Decisions, implementation and evidence travel together.</text>

  <rect x="65" y="130" width="800" height="315" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
  <text class="t" x="465" y="166" text-anchor="middle" font-size="20" font-weight="700">Pull request</text>

  <rect x="100" y="205" width="210" height="165" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text class="t" x="205" y="240" text-anchor="middle" font-size="19" font-weight="700">Decisions</text>
  <text class="t muted" x="205" y="270" text-anchor="middle" font-size="14">semantic Decision proposals</text>
  <text class="t muted" x="205" y="294" text-anchor="middle" font-size="14">invariants · trade-offs</text>
  <text class="t muted" x="205" y="318" text-anchor="middle" font-size="14">boundaries · accepted risk</text>
  <rect x="125" y="335" width="160" height="24" rx="12" fill="#dbeafe"/>
  <text class="t" x="205" y="352" text-anchor="middle" font-size="12" font-weight="700">human acceptance required</text>

  <rect x="360" y="205" width="210" height="165" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-width="2.5"/>
  <text class="t" x="465" y="240" text-anchor="middle" font-size="19" font-weight="700">Implementation</text>
  <text class="t muted" x="465" y="270" text-anchor="middle" font-size="14">code · tests · infra</text>
  <text class="t muted" x="465" y="294" text-anchor="middle" font-size="14">agent-executed artefacts</text>
  <text class="t muted" x="465" y="318" text-anchor="middle" font-size="14">bounded local choices</text>
  <rect x="385" y="335" width="160" height="24" rx="12" fill="#ffedd5"/>
  <text class="t" x="465" y="352" text-anchor="middle" font-size="12" font-weight="700">AI conformance review</text>

  <rect x="620" y="205" width="210" height="165" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text class="t" x="725" y="240" text-anchor="middle" font-size="19" font-weight="700">Evidence</text>
  <text class="t muted" x="725" y="270" text-anchor="middle" font-size="14">tests · benchmarks</text>
  <text class="t muted" x="725" y="294" text-anchor="middle" font-size="14">qualification boundary</text>
  <text class="t muted" x="725" y="318" text-anchor="middle" font-size="14">known residual risk</text>
  <rect x="645" y="335" width="160" height="24" rx="12" fill="#dcfce7"/>
  <text class="t" x="725" y="352" text-anchor="middle" font-size="12" font-weight="700">evidence, not confidence</text>

  <path class="line" d="M865 287 H930"/>
  <rect x="940" y="215" width="205" height="145" rx="16" fill="#eef2ff" stroke="#6366f1" stroke-width="2.5"/>
  <text class="t" x="1042.5" y="251" text-anchor="middle" font-size="19" font-weight="700">Accept</text>
  <text class="t muted" x="1042.5" y="280" text-anchor="middle" font-size="14">human acceptance makes Decisions</text>
  <text class="t muted" x="1042.5" y="303" text-anchor="middle" font-size="14">authoritative for this change</text>
  <text class="t muted" x="1042.5" y="332" text-anchor="middle" font-size="13">accepted records become immutable</text>

  <rect x="100" y="475" width="470" height="88" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text class="t" x="335" y="506" text-anchor="middle" font-size="17" font-weight="700">Human review prioritises</text>
  <text class="t muted" x="335" y="533" text-anchor="middle" font-size="14">decisions · semantic model · trade-offs · accepted risk</text>

  <rect x="630" y="475" width="470" height="88" rx="14" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text class="t" x="865" y="506" text-anchor="middle" font-size="17" font-weight="700">Agent review prioritises</text>
  <text class="t muted" x="865" y="533" text-anchor="middle" font-size="14">implementation conformance · edge cases · test gaps · drift</text>

  <text class="t muted" x="600" y="596" text-anchor="middle" font-size="13">PR merge is one common acceptance mechanism; the methodology requires human acceptance, not Git.</text>
</svg>