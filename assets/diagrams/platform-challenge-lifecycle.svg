<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Platform Challenge lifecycle</title>
<desc id="desc">Humans or agents raise Challenges. Investigation can lead to no change, implementation correction, a human Decision change, evidence correction, accepted risk, or split.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker><style>.t{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#0f172a}.m{fill:#475569}.b{fill:#fff;stroke:#cbd5e1;stroke-width:2}.l{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#a)}</style></defs>
<rect width="1200" height="650" rx="20" fill="#f8fafc"/>
<text class="t" x="600" y="48" text-anchor="middle" font-size="27" font-weight="700">Challenge is the question layer</text>
<text class="t m" x="600" y="78" text-anchor="middle" font-size="15">It can be machine-created because it does not change authority.</text>
<rect x="55" y="245" width="185" height="120" rx="15" fill="#fff7ed" stroke="#f59e0b" stroke-width="2.5"/><text class="t" x="147.5" y="283" text-anchor="middle" font-size="19" font-weight="700">Challenge</text><text class="t m" x="147.5" y="311" text-anchor="middle" font-size="13">human or agent</text><text class="t m" x="147.5" y="334" text-anchor="middle" font-size="13">question current state</text>
<path class="l" d="M240 305H325"/><rect x="335" y="245" width="190" height="120" rx="15" class="b"/><text class="t" x="430" y="283" text-anchor="middle" font-size="19" font-weight="700">Investigate</text><text class="t m" x="430" y="311" text-anchor="middle" font-size="13">research · reproduce</text><text class="t m" x="430" y="334" text-anchor="middle" font-size="13">gather evidence</text>
<rect x="615" y="120" width="220" height="72" rx="14" class="b"/><text class="t" x="725" y="151" text-anchor="middle" font-size="16" font-weight="700">No change</text><text class="t m" x="725" y="175" text-anchor="middle" font-size="12">current model stands</text>
<rect x="615" y="210" width="220" height="72" rx="14" class="b"/><text class="t" x="725" y="241" text-anchor="middle" font-size="16" font-weight="700">Implementation fix</text><text class="t m" x="725" y="265" text-anchor="middle" font-size="12">restore conformance</text>
<rect x="615" y="300" width="220" height="72" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/><text class="t" x="725" y="331" text-anchor="middle" font-size="16" font-weight="700">Decision change</text><text class="t m" x="725" y="355" text-anchor="middle" font-size="12">human authority required</text>
<rect x="615" y="390" width="220" height="72" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text class="t" x="725" y="421" text-anchor="middle" font-size="16" font-weight="700">Evidence correction</text><text class="t m" x="725" y="445" text-anchor="middle" font-size="12">requalify claim</text>
<rect x="615" y="480" width="220" height="72" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><text class="t" x="725" y="511" text-anchor="middle" font-size="16" font-weight="700">Risk / split</text><text class="t m" x="725" y="535" text-anchor="middle" font-size="12">human judgement if semantic</text>
<path class="l" d="M525 305C570 305 570 156 605 156"/><path class="l" d="M525 305C570 305 570 246 605 246"/><path class="l" d="M525 305H605"/><path class="l" d="M525 305C570 305 570 426 605 426"/><path class="l" d="M525 305C570 305 570 516 605 516"/>
<rect x="930" y="260" width="210" height="145" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/><text class="t" x="1035" y="299" text-anchor="middle" font-size="18" font-weight="700">Resolved</text><text class="t m" x="1035" y="328" text-anchor="middle" font-size="13">resolution + evidence</text><text class="t m" x="1035" y="351" text-anchor="middle" font-size="13">links to Decision</text><text class="t m" x="1035" y="374" text-anchor="middle" font-size="13">or implementation</text>
<path class="l" d="M835 156C890 156 900 280 920 300"/><path class="l" d="M835 246C890 246 900 310 920 320"/><path class="l" d="M835 336H920"/><path class="l" d="M835 426C890 426 900 370 920 360"/><path class="l" d="M835 516C890 516 900 400 920 380"/>
<text class="t m" x="600" y="615" text-anchor="middle" font-size="13">Challenge provides machine initiative without machine authority.</text>
</svg>