$schema: "https://json-schema.org/draft/2020-12/schema"
$title: "Model-led agentic engineering decision front matter"
type: object
additionalProperties: false
required:
  - id
  - title
  - type
  - supersedes
properties:
  id:
    type: string
    pattern: "^DEC-[0-9]{8}-[0-9]{6}-[a-z0-9][a-z0-9-]*$"
  title:
    type: string
    minLength: 1
    maxLength: 160
  type:
    type: string
    enum:
      - invariant
      - architecture
      - behaviour
      - interface
      - security
      - operational
      - product
      - process
  author:
    type: string
    minLength: 1
    description: "Optional provenance for who originated/authored the Decision record or proposal. This field does not prove human acceptance or confer semantic authority."
  accepted_by:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      minLength: 1
    description: "Optional descriptive provenance for humans recorded as accepting the semantic Decision. This field does not independently prove acceptance."
  recorded_at:
    type: string
    format: date-time
    description: "Optional timestamp for when the Decision record or proposal was written."
  accepted_at:
    type: string
    format: date-time
    description: "Optional timestamp for when human acceptance was recorded. This field does not independently prove acceptance."
  decided_at:
    type: string
    format: date-time
    description: "Optional legacy/general Decision timestamp retained for backwards compatibility. Prefer recorded_at or accepted_at when the distinction matters."
  scope:
    type: object
    additionalProperties: false
    properties:
      areas:
        type: array
        uniqueItems: true
        items:
          type: string
          minLength: 1
      paths:
        type: array
        uniqueItems: true
        items:
          type: string
          minLength: 1
  supersedes:
    type: array
    uniqueItems: true
    items:
      type: string
      pattern: "^DEC-[0-9]{8}-[0-9]{6}-[a-z0-9][a-z0-9-]*$"
  related:
    type: array
    uniqueItems: true
    items:
      type: string
      pattern: "^DEC-[0-9]{8}-[0-9]{6}-[a-z0-9][a-z0-9-]*$"
  tags:
    type: array
    uniqueItems: true
    items:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]*$"
